openapi: 3.0.3
info:
  title: Tasks API
  version: 1.0.0
  description: Quản lý task nội bộ
servers:
  - url: 'http://localhost:5000/v1'
security:
  - bearerAuth: []
tags:
  - name: tasks
    description: Nhóm các API xử lý công việc
paths:
  /tasks:
    get:
      tags:
        - tasks
      operationId: listTasks
      summary: Lấy danh sách task
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Danh sách task trả về thành công
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthorized'
          
    post:
      tags:
        - tasks
      operationId: createTask
      summary: Tạo task mới
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskInput'
      responses:
        '201':
          description: Tạo thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '422':
          $ref: '#/components/responses/ValidationError'

  /tasks/{taskId}:
    parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: string
          format: uuid
          
    get:
      tags:
        - tasks
      operationId: getTaskById
      summary: Lấy chi tiết một task
      responses:
        '200':
          description: Lấy dữ liệu thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          $ref: '#/components/responses/NotFound'
          
    patch:
      tags:
        - tasks
      operationId: patchTask
      summary: Cập nhật task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskInput'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          $ref: '#/components/responses/NotFound'
          
    delete:
      tags:
        - tasks
      operationId: deleteTask
      summary: Xóa task
      responses:
        '204':
          description: Xóa thành công, không trả về nội dung
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Task:
      type: object
      required:
        - id
        - title
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        status:
          type: string
          enum: [open, done]
        priority:
          type: string
          enum: [low, normal, high]
        dueDate:
          type: string
          format: date
        assigneeId:
          type: string
    CreateTaskInput:
      type: object
      required:
        - title
      properties:
        title:
          type: string
        priority:
          type: string
          enum: [low, normal, high]
          default: normal
    Error:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
  responses:
    Unauthorized:
      description: Lỗi chưa xác thực (Thiếu token)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Lỗi không tìm thấy tài nguyên
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Lỗi dữ liệu đầu vào không hợp lệ
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'