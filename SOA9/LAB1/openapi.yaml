openapi: 3.0.3
info:
  title: User API Versioning (v1 & v2)
  version: 1.0.0
  description: OpenAPI Specification minh họa URI Path Versioning (Practice 1)
paths:
  /api/v1/users/{id}:
    get:
      summary: Lấy thông tin user theo ID (v1 - Sắp sunset)
      deprecated: true
      parameters:
        - name: id
          in: path
          required: true
          description: User ID
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Thông tin user với schema cũ (full_name)
          headers:
            Sunset:
              description: Thời điểm API v1 ngừng hoạt động (RFC 8594)
              schema:
                type: string
                example: "Thu, 31 Dec 2026 23:59:59 GMT"
            Deprecation:
              description: Cảnh báo endpoint đã bị deprecated
              schema:
                type: string
                example: "true"
            Link:
              description: Liên kết đến phiên bản kế nhiệm
              schema:
                type: string
                example: '</api/v2/users>; rel="successor-version"'
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    example: 1
                  full_name:
                    type: string
                    example: "Văn Nguyễn"
                  email:
                    type: string
                    example: "a@vnu.vn"
        '404':
          description: Không tìm thấy user
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "nf"

  /api/v2/users/{id}:
    get:
      summary: Lấy thông tin user theo ID (v2 - Breaking change)
      parameters:
        - name: id
          in: path
          required: true
          description: User ID
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Thông tin user với schema mới (first_name, last_name)
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    example: 1
                  first_name:
                    type: string
                    example: "Văn"
                  last_name:
                    type: string
                    example: "Nguyễn"
                  email:
                    type: string
                    example: "a@vnu.vn"
        '404':
          description: Không tìm thấy user

  /api/v2/users:
    post:
      summary: Tạo mới user (v2)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - first_name
                - last_name
                - email
              properties:
                first_name:
                  type: string
                  example: "Hải"
                last_name:
                  type: string
                  example: "Lê"
                email:
                  type: string
                  example: "hai@vnu.vn"
      responses:
        '201':
          description: Tạo user thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    example: 3
                  first_name:
                    type: string
                  last_name:
                    type: string
                  email:
                    type: string
        '400':
          description: Thiếu thông tin bắt buộc
